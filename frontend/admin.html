    async function exportOrders(e) {
      const btn = e.currentTarget; btn.disabled = true;
      try {
        const p = ordQuery(); p.delete('page'); p.delete('per_page'); p.delete('sort');
        const res = await fetch('/api/admin/orders/export?' + p, { headers: { 'X-Admin-Token': STATE.token } });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          if (res.status === 403) { signOut(data.error || 'Mã quản trị không đúng.'); return; }
          throw new Error(data.error || 'Không xuất được danh sách (' + res.status + ').');
        }
        const name = (/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '') || [])[1] || 'don-hang.csv';
        const url = URL.createObjectURL(await res.blob());
        const a = h('a', { href: url, download: name });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('Đã xuất ' + name + '.');
      } catch (err) { toast(err.message || 'Không xuất được danh sách.', true); }
      btn.disabled = false;
    }

    // ==========================================================================================
    // Sản phẩm (the price + stock editor)
    // ==========================================================================================
    const FILTERS = [['all', 'Tất cả', 'total'], ['available', 'Còn hàng', 'available'], ['low', 'Sắp hết', 'low'], ['out', 'Hết hàng', 'out'], ['untracked', 'Chưa đếm', 'untracked']];

    function openProducts(params) {
      const wanted = params.get('status');
      if (wanted && FILTERS.some(([k]) => k === wanted)) { STATE.status = wanted; STATE.page = 1; }
      const search = h('input', { class: 'field', id: 'q', type: 'search', autocomplete: 'off', placeholder: 'Tìm theo tên đĩa, nghệ sĩ hoặc mã Discogs', 'aria-label': 'Tìm sản phẩm', value: STATE.search });
      let timer;
      search.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => { STATE.search = search.value.trim(); STATE.page = 1; load(); }, 300);
      });
      search.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); STATE.search = search.value.trim(); STATE.page = 1; load(); } });
      fill($('#view'), 
        pageHead('Sản phẩm', h('button', { class: 'btn btn-primary', type: 'button', onclick: openAdd }, 'Thêm sản phẩm')),
        h('div', { class: 'filters', id: 'tabs', role: 'group', 'aria-label': 'Lọc theo tồn kho' }),
        h('div', { class: 'toolbar' }, h('div', { class: 'search' }, search)),
        h('div', { class: 'table', id: 'table', role: 'table', 'aria-label': 'Sản phẩm' }),
        h('div', { class: 'pager', id: 'pager' }));
      STATE.loaded = false;
      renderTabs();
      return load();
    }

    function renderTabs() {
      const box = $('#tabs'); if (!box) return;
      const s = STATE.summary || {};
      fill(box, ...FILTERS.map(([key, label, field]) => {
        const attn = key === 'low' && s.low > 0 ? ' is-attn' : (key === 'out' && s.out > 0 ? ' is-attn-out' : '');
        const chip = h('button', { class: 'chip' + attn, type: 'button', 'aria-pressed': String(STATE.status === key) }, label, h('b', null, s[field] === undefined ? '' : s[field]));
        chip.addEventListener('click', () => { STATE.status = key; STATE.page = 1; writeHash('products', new URLSearchParams(key === 'all' ? '' : 'status=' + key)); load(); });
        return chip;
      }));
    }

    function renderTable() {
      const box = $('#table'); if (!box) return;
      box.classList.toggle('is-loading', STATE.loading && STATE.loaded);
      if (!STATE.loaded) { fill(box, h('div', { class: 'empty' }, h('p', null, STATE.loadError || 'Đang tải…'))); return; }
      if (STATE.loadError) { fill(box, h('div', { class: 'empty' }, h('p', null, STATE.loadError), h('button', { class: 'btn', type: 'button', onclick: load }, 'Thử lại'))); return; }
      if (!STATE.products.length) {
        const filtered = STATE.search || STATE.status !== 'all';
        fill(box, h('div', { class: 'empty' },
          h('p', null, filtered ? 'Không có sản phẩm nào khớp. Thử bỏ bộ lọc hoặc đổi từ khóa.' : 'Cửa hàng chưa có sản phẩm nào. Bấm Thêm sản phẩm để chọn đĩa từ Discogs.'),
          filtered ? h('button', { class: 'btn', type: 'button', onclick: () => { STATE.status = 'all'; STATE.search = ''; STATE.page = 1; const q = $('#q'); if (q) q.value = ''; writeHash('products', new URLSearchParams()); load(); } }, 'Xóa bộ lọc') : h('button', { class: 'btn btn-primary', type: 'button', onclick: openAdd }, 'Thêm sản phẩm')));
        return;
      }
      fill(box, productHead(), ...STATE.products.map(productRow));
    }
    const productHead = () => h('div', { class: 'thead', role: 'row' }, h('span', null, 'Sản phẩm'), h('span', null, 'Giá bán'), h('span', null, 'Tồn kho'), h('span'));

    function renderPager() {
      const box = $('#pager'); if (!box) return;
      const pg = STATE.pagination;
      if (!pg || pg.pages <= 1) { fill(box, ); return; }
      const go = n => { STATE.page = n; load(); window.scrollTo({ top: 0 }); };
      fill(box, 
        h('button', { class: 'btn', type: 'button', disabled: pg.page <= 1, onclick: () => go(pg.page - 1) }, 'Trang trước'),
        h('span', null, 'Trang ' + pg.page + ' / ' + pg.pages + ', ' + pg.items + ' sản phẩm'),
        h('button', { class: 'btn', type: 'button', disabled: pg.page >= pg.pages, onclick: () => go(pg.page + 1) }, 'Trang sau'));
    }

    let loadSeq = 0;
    async function load() {
      const seq = ++loadSeq;
      STATE.loading = true; renderTable();
      try {
        const qs = new URLSearchParams({ status: STATE.status, page: String(STATE.page), per_page: '20' });
        if (STATE.search) qs.set('search', STATE.search);
        const d = await api('/products?' + qs);
        if (seq !== loadSeq) return;
        Object.assign(STATE, { products: d.products, summary: d.summary, pagination: d.pagination, page: d.pagination.page, loaded: true, loadError: '' });
      } catch (e) {
        if (seq !== loadSeq || !STATE.token) return;
        STATE.loadError = e.message;
      }
      STATE.loading = false;
      if (!STATE.token || STATE.view !== 'products') return;
      renderTabs(); renderTable(); renderPager();
    }

    // ==========================================================================================
    // ==========================================================================================
    // Sự cố: customer cancel / return requests and shipping, return, carrier, money incidents
    // ==========================================================================================
    let CASEMETA = null;
    async function caseMeta() { if (!CASEMETA) CASEMETA = await api('/cases/meta'); return CASEMETA; }
    const groupLabel = g => ((CASEMETA && CASEMETA.groups.find(x => x.key === g)) || {}).label || '';
    const caseBadge = (status, label) => h('span', { class: 'badge cs-' + status }, label);
    const CASE_TABS = [['active', 'Đang mở'], ['open', 'Cần xử lý'], ['waiting_carrier', 'Chờ ĐVVC'], ['waiting_customer', 'Chờ khách'],
      ['resolved', 'Đã xong'], ['rejected', 'Đã từ chối'], ['all', 'Tất cả']];
    const CS_DEFAULTS = { tab: 'active', group: '', type: '', source: '', flag: '', q: '', page: 1 };
    const CS = Object.assign({ seq: 0, data: null }, CS_DEFAULTS);
    const ACTOR = { shop: 'Shop', customer: 'Khách', system: 'Hệ thống' };
    // Types where the parcel usually comes back unsellable: the "receive return" form starts on "không cộng kho".
    const DAMAGED_RETURN_TYPES = ['return_broken', 'return_empty_box', 'return_wrong_item'];

    function dueLine(c) {
      if (!c.due_at || !['open', 'waiting_carrier', 'waiting_customer'].includes(c.status)) return null;
      const d = toDate(c.due_at), left = d.getTime() - Date.now();
      const what = c.status === 'waiting_carrier' ? 'kiểm tra lại' : 'xử lý';
      return left <= 0
        ? h('div', { class: 'due is-late' }, 'Quá hạn ' + what + ' ' + duration(-left))
        : h('div', { class: 'due' + (left < 6 * 3600000 ? ' is-soon' : '') }, 'Hạn ' + what + ' ' + fmtTime.format(d));
    }

    async function openCases(params) {
      Object.assign(CS, CS_DEFAULTS);
      for (const k of Object.keys(CS_DEFAULTS)) if (params.has(k)) CS[k] = k === 'page' ? Math.max(1, parseInt(params.get(k), 10) || 1) : params.get(k);
      if (!CASE_TABS.some(([k]) => k === CS.tab)) CS.tab = 'active';
      const search = h('input', { class: 'field', type: 'search', autocomplete: 'off', value: CS.q, id: 'cq',
        placeholder: 'Mã sự cố, mã đơn, tên, SĐT, mã vận đơn', 'aria-label': 'Tìm sự cố' });
      let timer;
      const go = () => { clearTimeout(timer); CS.q = search.value.trim(); CS.page = 1; loadCases(); };
      search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(go, 350); });
      search.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      fill($('#view'),
        pageHead('Sự cố đơn hàng', search,
          h('button', { class: 'btn btn-primary', type: 'button', onclick: () => openCreateCase({ onCreated: () => loadCases() }) }, 'Tạo sự cố'),
          h('button', { class: 'btn icon-only', type: 'button', title: 'Tải lại', 'aria-label': 'Tải lại danh sách sự cố', onclick: () => loadCases() }, icon('refresh'))),
        h('section', { class: 'panel', id: 'cs-summary', 'aria-label': 'Tình hình sự cố' }, h('p', { class: 'panel-empty' }, 'Đang tải…')),
        h('section', { class: 'panel', style: 'padding-top:6px' },
          h('div', { class: 'tabs', id: 'cs-tabs', role: 'tablist', 'aria-label': 'Trạng thái sự cố' }),
          h('div', { class: 'filterbar', id: 'cs-filters' }),
          h('div', { class: 'table', id: 'cs-table' }),
          h('div', { class: 'pager', id: 'cs-pager' })));
      try { await caseMeta(); } catch (e) { if (STATE.token) fill($('#cs-table'), errorBox(e.message, () => openCases(params))); return; }
      return loadCases();
    }

    function csParams() {
      const p = new URLSearchParams();
      for (const k of Object.keys(CS_DEFAULTS)) if (String(CS[k]) !== String(CS_DEFAULTS[k])) p.set(k, CS[k]);
      return p;
    }
    function setCs(patch) { Object.assign(CS, { page: 1 }, patch); loadCases(); }

    async function loadCases() {
      const seq = ++CS.seq;
      writeHash('cases', csParams());
      const table = $('#cs-table'); if (table) table.classList.add('is-loading');
      try {
        const p = new URLSearchParams({ tab: CS.tab, page: CS.page, per_page: 20 });
        ['group', 'type', 'source', 'flag', 'q'].forEach(k => { if (CS[k]) p.set(k, CS[k]); });
        const d = await api('/cases?' + p);
        if (seq !== CS.seq || STATE.view !== 'cases') return;
        CS.data = d; CS.page = d.pagination.page;
        setCasesBadge(d.summary.active);
        renderCaseSummary(); renderCaseTabs(); renderCaseFilters(); renderCaseTable(); renderCasePager();
      } catch (e) {
        if (seq !== CS.seq || !STATE.token || STATE.view !== 'cases') return;
        if (table) { table.classList.remove('is-loading'); fill(table, errorBox(e.message, loadCases)); }
      }
    }

    function renderCaseSummary() {
      const s = CS.data.summary;
      const on = (tab, flag) => CS.tab === tab && CS.flag === flag && !CS.group && !CS.type && !CS.source;
      fill($('#cs-summary'),
        h('div', { class: 'stat-row' },
          stat({ label: 'Khách gửi, chưa xử lý', value: s.untouched, alert: s.untouched > 0, pressed: on('active', 'untouched'),
            sub: 'Trả lời trong 24 giờ', onclick: () => setCs({ tab: 'active', flag: 'untouched', group: '', type: '', source: '' }) }),
          stat({ label: 'Quá hạn xử lý', value: s.overdue, alert: s.overdue > 0, pressed: on('active', 'overdue'),
            onclick: () => setCs({ tab: 'active', flag: 'overdue', group: '', type: '', source: '' }) }),
          stat({ label: 'Cần xử lý', value: s.open, pressed: on('open', ''), onclick: () => setCs({ tab: 'open', flag: '' }) }),
          stat({ label: 'Chờ ĐVVC', value: s.waiting_carrier, pressed: on('waiting_carrier', ''), onclick: () => setCs({ tab: 'waiting_carrier', flag: '' }) }),
          stat({ label: 'Chờ khách', value: s.waiting_customer, pressed: on('waiting_customer', ''), onclick: () => setCs({ tab: 'waiting_customer', flag: '' }) }),
          stat({ label: 'Bồi thường chờ nhận', value: money(s.awaiting_money), pressed: on('active', 'money'),
            onclick: () => setCs({ tab: 'active', flag: 'money', group: '', type: '', source: '' }) })),
        h('p', { class: 'strip-foot' }, 'Từ trước tới nay: đã hoàn cho khách ' + money(s.refunded) + ', ĐVVC đã bồi thường ' + money(s.compensated) + '.'));
    }

    function renderCaseTabs() {
      const c = CS.data.counts;
      fill($('#cs-tabs'), ...CASE_TABS.map(([key, label]) => h('button', {
        class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(CS.tab === key),
        onclick: () => { if (CS.tab !== key) setCs({ tab: key, flag: '' }); }
      }, label, c[key] ? h('b', null, VND(c[key])) : null)));
    }

    function renderCaseFilters() {
      const types = CASEMETA.types.filter(t => !CS.group || t.group === CS.group);
      const any = CS.group || CS.type || CS.source || CS.flag || CS.q;
      const n = CS.data.pagination.items;
      fill($('#cs-filters'),
        selectBox('Nhóm tình huống', [['', 'Mọi nhóm']].concat(CASEMETA.groups.map(g => [g.key, g.label])), CS.group, v => setCs({ group: v, type: '' }), true),
        selectBox('Tình huống', [['', 'Mọi tình huống']].concat(types.map(t => [t.key, t.label])), CS.type, v => setCs({ type: v }), true),
        selectBox('Nguồn', [['', 'Khách gửi và shop tạo'], ['customer', 'Khách gửi'], ['shop', 'Shop tạo']], CS.source, v => setCs({ source: v }), true),
        any ? h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { const q = $('#cq'); if (q) q.value = ''; setCs({ group: '', type: '', source: '', flag: '', q: '' }); } }, 'Bỏ lọc') : null,
        h('span', { class: 'found' }, n ? 'Tìm thấy ' + VND(n) + ' sự cố' : ''));
    }

    function renderCaseTable() {
      const box = $('#cs-table'); box.classList.remove('is-loading');
      const list = CS.data.cases;
      if (!list.length) {
        fill(box, h('div', { class: 'empty' }, h('p', null, CS.tab === 'active' && !CS.flag && !CS.q
          ? 'Không có sự cố nào đang mở. Khi khách gửi yêu cầu hủy, trả hàng hoặc báo lỗi, yêu cầu sẽ hiện ở đây.'
          : 'Không có sự cố nào khớp bộ lọc.'),
          h('button', { class: 'btn', type: 'button', onclick: () => openCreateCase({ onCreated: () => loadCases() }) }, 'Tạo sự cố')));
        return;
      }
      fill(box,
        h('div', { class: 'cthead', role: 'row' }, h('span', null, 'Sự cố'), h('span', null, 'Tình huống'), h('span', null, 'Đơn hàng'),
          h('span', null, 'Trạng thái'), h('span', { class: 'num' }, 'Tiền')),
        ...list.map(c => {
          const created = toDate(c.created_at);
          const row = h('div', { class: 'crow' + (c.untouched ? ' is-new' : c.overdue ? ' is-late' : ''), role: 'row' },
            h('div', null, h('button', { class: 'ord-no', type: 'button', onclick: e => { e.stopPropagation(); openCase(c.code, loadCases); } }, c.code),
              h('div', { class: 'small', title: fmtFull.format(created) }, ago(c.created_at)),
              h('span', { class: 'src src-' + c.source }, c.source === 'customer' ? 'Khách gửi' : 'Shop tạo'),
              c.untouched ? h('span', { class: 'src src-new' }, 'Mới') : null),
            h('div', { style: 'min-width:0' }, h('div', { class: 'title' }, c.type_label), h('div', { class: 'small' }, groupLabel(c.group))),
            h('div', { style: 'min-width:0' }, c.order_no ? h('div', null, c.order_no) : h('div', { class: 'small' }, 'Không gắn đơn'),
              c.order_no ? h('div', { class: 'small clip' }, c.customer + (c.order_status_label ? ', ' + c.order_status_label.toLowerCase() : '')) : null),
            h('div', null, caseBadge(c.status, c.status_label), dueLine(c)),
            h('div', { class: 'num', style: 'font-weight:400' },
              c.refunded ? h('div', null, 'Hoàn ' + money(c.refunded)) : null,
              c.claimed ? h('div', { class: 'small' }, 'Đòi ' + money(c.claimed)) : null,
              c.compensated ? h('div', { class: 'small', style: 'color:var(--ok)' }, 'Nhận ' + money(c.compensated)) : null,
              !c.refunded && !c.claimed && !c.compensated ? h('span', { class: 'small' }, '—') : null));
          row.addEventListener('click', () => openCase(c.code, loadCases));
          return row;
        }));
    }

    function renderCasePager() {
      const pg = CS.data.pagination;
      const go = n => { CS.page = n; loadCases(); };
      fill($('#cs-pager'),
        pg.pages > 1 ? h('button', { class: 'btn', type: 'button', disabled: pg.page <= 1, onclick: () => go(pg.page - 1) }, 'Trang trước') : null,
        pg.pages > 1 ? h('span', null, 'Trang ' + pg.page + ' / ' + pg.pages) : null,
        pg.pages > 1 ? h('button', { class: 'btn', type: 'button', disabled: pg.page >= pg.pages, onclick: () => go(pg.page + 1) }, 'Trang sau') : null);
    }

    const casesBadge = { n: 0 };
    function setCasesBadge(n) { if (casesBadge.n !== n) { casesBadge.n = n; renderNav(); } }

    // ---- create -------------------------------------------------------------------------------
    async function openCreateCase(opts) {
      opts = opts || {};
      try { await caseMeta(); } catch (e) { toast(e.message, true); return; }
      const order = h('input', { class: 'field', value: opts.order_no || '', placeholder: 'BUI-XXXXXXXX', 'aria-label': 'Mã đơn hàng', autocomplete: 'off' });
      const group = h('select', { class: 'select', 'aria-label': 'Nhóm tình huống', style: 'width:100%' },
        ...CASEMETA.groups.map(g => h('option', { value: g.key }, g.label)));
      const type = h('select', { class: 'select', 'aria-label': 'Tình huống', style: 'width:100%' });
      const steps = h('ol', { class: 'steps-preview' });
      const detail = h('textarea', { class: 'field', rows: 3, maxlength: 1000, placeholder: 'Khách nói gì, ĐVVC báo gì, bằng chứng đang có (ảnh, video, mã khiếu nại)…' });
      const error = h('p', { class: 'form-error', role: 'alert' });
      const ok = h('button', { class: 'btn btn-primary', type: 'button' }, 'Tạo sự cố');
      const fillTypes = () => {
        const list = CASEMETA.types.filter(t => t.group === group.value);
        type.replaceChildren(...list.map(t => h('option', { value: t.key }, t.label)));
        showSteps();
      };
      const showSteps = () => {
        const t = CASEMETA.types.find(x => x.key === type.value);
        fill(steps, ...(t ? t.steps.map(s => h('li', null, s)) : []));
        order.placeholder = t && !t.needs_order ? 'Không bắt buộc' : 'BUI-XXXXXXXX';
      };
      group.addEventListener('change', fillTypes); type.addEventListener('change', showSteps);
      fillTypes();
      const m = openModal('Tạo sự cố', h('div', null,
        h('label', null, 'Mã đơn hàng', order),
        h('label', null, 'Nhóm tình huống', group),
        h('label', null, 'Tình huống', type),
        h('div', { class: 'steps-box' }, h('b', null, 'Cách xử lý'), steps),
        h('label', null, 'Mô tả', detail),
        error, h('div', { class: 'modal-actions' }, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'Hủy'), ok)), true);
      ok.addEventListener('click', async () => {
        ok.disabled = true; error.textContent = '';
        try {
          const c = await api('/cases', { method: 'POST', body: { order_no: order.value.trim(), type: type.value, detail: detail.value } });
          m.close(); toast('Đã tạo sự cố ' + c.code + '.');
          if (opts.onCreated) opts.onCreated(c);
          openCase(c.code, opts.onCreated);
        } catch (e) { ok.disabled = false; error.textContent = e.message; }
      });
      (opts.order_no ? group : order).focus();
    }

    // ---- one case ------------------------------------------------------------------------------
    function openCase(code, onChange) {
      const body = h('div', null, h('p', { class: 'hint' }, 'Đang tải sự cố…'));
      const m = openModal('Sự cố ' + code, body, 'xl');
      let current = null;
      const changed = () => { if (onChange) onChange(); };
      const run = async (payload, btn) => {
        if (btn) btn.disabled = true;
        try {
          const d = await api('/cases/' + code + '/actions', { method: 'POST', body: payload });
          toast(d.message); show(d); changed();
          return true;
        } catch (e) { if (btn) btn.disabled = false; if (STATE.token) toast(e.message, true); return false; }
      };

      const show = c => {
        current = c;
        const open = ['open', 'waiting_carrier', 'waiting_customer'].includes(c.status);
        const o = c.order;
        const canTellCustomer = !!(o && o.has_account);
        const formBox = h('div', { class: 'action-form', hidden: true });

        // what the customer asked for
        const request = c.source === 'customer' ? h('div', { class: 'od-note', style: 'margin:0' },
          h('b', null, 'Khách báo: ' + (c.reason_label || c.type_label)), c.detail ? h('div', null, c.detail) : null)
          : (c.detail ? h('div', { class: 'od-note', style: 'margin:0;border-left-color:var(--line-strong)' }, c.detail) : null);

        // the order
        const orderBox = o ? h('div', { class: 'od-box' },
          h('h3', null, 'Đơn hàng'),
          h('p', null, h('button', { class: 'link-btn', type: 'button', onclick: () => openOrder(o.order_no) }, o.order_no), ' ', badge(o.status, o.status_label)),
          h('p', null, o.name + ', ', h('a', { href: 'tel:' + o.phone }, o.phone)),
          h('p', { class: 'small' }, o.items.map(i => i.title + ' x' + i.qty).join('; ')),
          h('p', null, 'Khách trả ' + money(o.total) + ', ' + o.payment_label + (o.refunded ? ', đã hoàn ' + money(o.refunded) : '')),
          h('p', { class: 'small' }, o.carrier || o.tracking_no ? (o.carrier || 'ĐVVC') + (o.tracking_no ? ', mã ' + o.tracking_no : '') : 'Chưa nhập mã vận đơn'))
          : h('div', { class: 'od-box' }, h('h3', null, 'Đơn hàng'), h('p', { class: 'small' }, 'Sự cố không gắn với đơn cụ thể.'));

        const moneyBox = h('div', { class: 'od-box' }, h('h3', null, 'Tiền'),
          h('p', null, 'Đã hoàn khách: ' + money(c.refunded)),
          h('p', null, 'Yêu cầu bồi thường: ' + money(c.claimed) + (c.carrier_ref ? ' (mã ' + c.carrier_ref + ')' : '')),
          h('p', null, 'ĐVVC đã bồi thường: ', h('b', { style: c.compensated ? 'color:var(--ok)' : '' }, money(c.compensated))));

        // playbook
        const done = new Set(c.checklist);
        const checklist = h('ol', { class: 'checklist' }, ...c.steps.map((s, i) => {
          const box = h('input', { type: 'checkbox', checked: done.has(i), disabled: !open, id: 'st-' + code + '-' + i });
          box.addEventListener('change', async () => {
            box.checked ? done.add(i) : done.delete(i);
            try { await api('/cases/' + code + '/checklist', { method: 'PUT', body: { done: [...done] } }); }
            catch (e) { box.checked = !box.checked; if (STATE.token) toast(e.message, true); }
          });
          return h('li', null, box, h('label', { for: 'st-' + code + '-' + i }, s));
        }));

        const actionButtons = open ? c.actions.concat([{ key: 'reject', label: 'Từ chối yêu cầu' }, { key: 'resolve', label: 'Đóng sự cố' }])
          .filter((a, i, arr) => arr.findIndex(x => x.key === a.key) === i)
          .filter(a => a.key !== 'reject' || c.source === 'customer')
          .map(a => h('button', { class: 'btn btn-sm' + (a.key === 'resolve' ? ' btn-primary' : a.key === 'reject' ? ' btn-warn' : ''), type: 'button',
            onclick: () => actionForm(a.key, formBox) }, a.label)) : [];

        const statusSel = open ? selectBox('Trạng thái sự cố', [['open', 'Cần xử lý'], ['waiting_carrier', 'Chờ ĐVVC'], ['waiting_customer', 'Chờ khách']], c.status,
          v => run({ action: 'set_status', status: v })) : h('button', { class: 'btn btn-sm', type: 'button', onclick: e => run({ action: 'reopen' }, e.currentTarget) }, 'Mở lại sự cố');

        // reply / internal note
        const text = h('textarea', { class: 'field', rows: 2, maxlength: 1000, placeholder: canTellCustomer ? 'Ghi chú nội bộ, hoặc tin nhắn gửi khách' : 'Ghi chú nội bộ (khách không có tài khoản: hãy gọi hoặc nhắn tin)' });
        const toCustomer = h('input', { type: 'checkbox', id: 'pub-' + code, disabled: !canTellCustomer });
        const send = h('button', { class: 'btn btn-sm', type: 'button' }, 'Lưu');
        send.addEventListener('click', async () => {
          if (!text.value.trim()) { text.focus(); return; }
          if (await run({ action: 'note', text: text.value, public: toCustomer.checked }, send)) text.value = '';
        });

        const timeline = h('ol', { class: 'timeline' }, ...c.events.map(e => h('li', { class: 'ev ev-' + e.actor },
          h('div', { class: 'ev-meta' }, h('b', null, ACTOR[e.actor] || e.actor), ' ', fmtTime.format(toDate(e.at)),
            e.public ? h('span', { class: 'src src-customer' }, 'Khách thấy') : null),
          h('div', null, e.text))));

        fill(body,
          h('div', { class: 'od-top' }, caseBadge(c.status, c.status_label), h('span', { class: 'src src-' + c.source }, c.source === 'customer' ? 'Khách gửi' : 'Shop tạo'), dueLine(c)),
          h('h3', { class: 'case-title' }, c.type_label, h('span', { class: 'small' }, groupLabel(c.group))),
          h('div', { class: 'case-grid' },
            h('div', { class: 'case-main' },
              request,
              h('div', { class: 'od-grid', style: 'margin:0' }, orderBox, moneyBox),
              h('section', null, h('h4', null, 'Các bước xử lý'), checklist),
              h('section', null, h('div', { class: 'od-cases-head' }, h('h4', null, 'Thao tác'), statusSel),
                actionButtons.length ? h('div', { class: 'action-row' }, ...actionButtons) : h('p', { class: 'small' }, 'Sự cố đã đóng.'),
                formBox),
              h('section', null, h('h4', null, 'Ghi chú và trả lời khách'), text,
                h('div', { class: 'compose-row' }, h('label', { class: 'check', for: 'pub-' + code }, toCustomer, ' Gửi cho khách xem (hiện trong Tài khoản của khách)'), send))),
            h('aside', { class: 'case-side' }, h('h4', null, 'Diễn biến'), timeline)));
      };

      // One small form per action, shown under the buttons.
      function actionForm(key, box) {
        const c = current, o = c.order;
        const note = h('input', { class: 'field', placeholder: 'Ghi chú (không bắt buộc)', maxlength: 1000 });
        const submit = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'Xác nhận');
        const cancel = h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { box.hidden = true; box.replaceChildren(); } }, 'Thôi');
        const amountInput = (value, label) => h('div', { class: 'money' }, h('input', { class: 'field', inputmode: 'numeric', value: value ? VND(value) : '', 'aria-label': label, placeholder: label }));
        const readAmount = wrap => { const n = parseInt(wrap.querySelector('input').value.replace(/\D/g, ''), 10); return Number.isFinite(n) ? n : 0; };
        let fields = [], payload = () => ({}), intro = '';
        const st = o ? o.status : '';
        if (key === 'approve_cancel') {
          intro = st === 'shipping' ? 'Đơn đã giao cho ĐVVC: hãy yêu cầu ĐVVC dừng giao trước. Đơn sẽ chuyển sang Giao không thành công và chờ hàng hoàn.'
            : 'Đơn sẽ bị hủy và các bản đĩa được cộng lại kho.' + (o && ['bank', 'momo', 'zalopay', 'card'].includes(o.payment_method) ? ' Khách đã trả trước: nhớ hoàn tiền.' : '');
        } else if (['mark_delivered', 'mark_failed', 'mark_lost'].includes(key)) {
          intro = { mark_delivered: 'Đơn chuyển sang Đã giao.', mark_failed: 'Đơn chuyển sang Giao không thành công (đang chuyển hoàn hoặc chờ giao lại).',
            mark_lost: 'Đơn chuyển sang Thất lạc. Đĩa không được cộng lại kho.' }[key];
        } else if (key === 'receive_return') {
          const damaged = DAMAGED_RETURN_TYPES.includes(c.type);
          const ok = h('input', { type: 'radio', name: 'rs-' + code, value: '1', checked: !damaged, id: 'rs1-' + code });
          const bad = h('input', { type: 'radio', name: 'rs-' + code, value: '0', checked: damaged, id: 'rs0-' + code });
          fields = [h('div', { class: 'radio-col' },
            h('label', { class: 'check', for: 'rs1-' + code }, ok, ' Đĩa nguyên vẹn, cộng lại kho'),
            h('label', { class: 'check', for: 'rs0-' + code }, bad, ' Vỡ, hỏng, hộp rỗng hoặc không phải hàng shop: không cộng kho'))];
          payload = () => ({ restock: ok.checked });
          intro = 'Đơn chuyển sang Đã trả hàng.';
        } else if (key === 'reship') {
          const inputs = o.items.map(i => {
            const q = h('input', { class: 'field', type: 'number', min: 0, max: i.qty, value: c.type === 'missing_items' ? 0 : i.qty, style: 'width:80px', 'aria-label': 'Số bản gửi lại: ' + i.title });
            return { i, q, row: h('div', { class: 'reship-row' }, h('span', null, i.title), q, h('span', { class: 'small' }, 'tối đa ' + i.qty)) };
          });
          fields = inputs.map(x => x.row);
          payload = () => ({ items: inputs.map(x => ({ item_id: String(x.i.item_id), qty: parseInt(x.q.value, 10) || 0 })).filter(x => x.qty > 0) });
          intro = 'Tạo đơn mới 0₫ gửi tới cùng địa chỉ, trừ kho ngay, nằm trong nhóm Cần gửi.';
        } else if (key === 'refund') {
          const left = Math.max(0, o.total - o.refunded);
          const amt = amountInput(left, 'Số tiền hoàn');
          const method = h('input', { class: 'field', placeholder: 'Cách hoàn: chuyển khoản, Momo…', maxlength: 120 });
          fields = [amt, method];
          payload = () => ({ amount: readAmount(amt), method: method.value });
          intro = 'Còn có thể hoàn tối đa ' + money(left) + '. Ghi nhận sau khi đã chuyển tiền thật cho khách.';
        } else if (key === 'claim') {
          const damage = ['delivered_broken', 'empty_box', 'lost_outbound', 'shipper_damaged_lost', 'return_broken', 'return_lost', 'return_empty_box', 'delivered_not_received', 'missing_items'].includes(c.type);
          const amt = amountInput(c.claimed || (damage && o ? o.subtotal : 0), 'Số tiền yêu cầu bồi thường');
          const ref = h('input', { class: 'field', placeholder: 'Mã khiếu nại của ĐVVC', maxlength: 80, value: c.carrier_ref || '' });
          fields = [amt, ref];
          payload = () => ({ amount: readAmount(amt), carrier_ref: ref.value });
          intro = 'Sự cố chuyển sang Chờ ĐVVC, hẹn kiểm tra lại sau 7 ngày.';
        } else if (key === 'compensation') {
          const amt = amountInput(Math.max(0, c.claimed - c.compensated), 'Số tiền ĐVVC đã bồi thường');
          fields = [amt];
          payload = () => ({ amount: readAmount(amt) });
          intro = 'Ghi nhận khi tiền bồi thường đã vào tài khoản hoặc trừ vào kỳ đối soát.';
        } else if (key === 'reject') {
          const why = h('textarea', { class: 'field', rows: 2, maxlength: 1000, placeholder: 'Lý do (khách sẽ thấy), ví dụ: đơn đã giao cho ĐVVC nên không thể hủy' });
          fields = [why];
          payload = () => ({ reason: why.value });
          intro = 'Sự cố đóng lại ở trạng thái Đã từ chối.';
        } else if (key === 'resolve') {
          const sum = h('textarea', { class: 'field', rows: 2, maxlength: 1000, placeholder: 'Kết quả xử lý (không bắt buộc)' });
          const pub = h('input', { type: 'checkbox', id: 'rpub-' + code, disabled: !(o && o.has_account) });
          fields = [sum, h('label', { class: 'check', for: 'rpub-' + code }, pub, ' Gửi kết quả cho khách xem')];
          payload = () => ({ summary: sum.value, public: pub.checked });
          intro = c.steps.length && c.checklist.length < c.steps.length ? 'Còn ' + (c.steps.length - c.checklist.length) + ' bước chưa đánh dấu xong.' : '';
        }
        submit.addEventListener('click', async () => {
          if (await run(Object.assign({ action: key, note: note.value }, payload()), submit)) { box.hidden = true; }
        });
        fill(box, h('h5', null, ACTION_TITLE(key)), intro ? h('p', { class: 'small', style: 'margin:0 0 8px' }, intro) : null,
          ...fields, ['reject', 'resolve'].includes(key) ? null : note,
          h('div', { class: 'modal-actions', style: 'margin-top:10px' }, cancel, submit));
        box.hidden = false;
        const first = box.querySelector('input:not([type=radio]):not([type=checkbox]), textarea');
        if (first) first.focus();
      }
      const ACTION_TITLE = key => (CASEMETA && CASEMETA.actions[key]) || key;

      caseMeta().then(() => api('/cases/' + code)).then(show).catch(e => {
        if (!STATE.token) { m.close(); return; }
        fill(body, h('p', { class: 'form-error' }, e.message));
      });
    }

    const VIEWS = {
      home: { open: openHome, reload: loadHome },
      orders: { open: openOrders, reload: loadOrders },
      products: { open: openProducts, reload: load },
      inventory: { open: openInventory, reload: loadInventory },
      cases: { open: openCases, reload: loadCases }
    };

    function start() { renderShell(); route(); }

    if (STATE.token) start(); else renderLogin('');
  })();
  </script>
</body>
</html>
